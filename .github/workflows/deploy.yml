# Автодеплой: каждый push в main собирает сайт и публикует dist/ в ветку gh-pages.
# GitHub Pages уже настроен на ветку gh-pages, поэтому в настройках репозитория ничего менять не нужно.
# Запустить вручную: вкладка Actions → Deploy to GitHub Pages → Run workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # чтобы пушить в ветку gh-pages

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Ветка gh-pages — это просто содержимое dist/ одним коммитом (история сборок не нужна).
      - name: Publish dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          if ! git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages > ../push.log 2>&1; then
            # Текст ошибки — в аннотацию, чтобы его было видно на странице запуска.
            echo "::error title=Push to gh-pages failed::$(tail -n 5 ../push.log | tr '\n' ' ')"
            exit 1
          fi
          echo "Опубликовано: $(git rev-parse --short HEAD)"
